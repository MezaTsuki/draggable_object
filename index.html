<html>
<head>
    <link rel = "icon" type = "image/x-icon" href = "">
    <title> Wobbly DragBox </title>
    <link rel="stylesheet" href="styles.css"> <!-- if separate css file is used -->
    
</head>
<!--  --- Body Area ---  -->
<body>

    <div id = "dragBox">
        <h1>氷</h1>
    </div>

    <input type = "radio" name = "theme" id = "lightTheme">
    <input type = "radio" name = "theme" id = "darkTheme" checked>

    <div class =  "toolKit">
        <!-- #ToolKit Button -->
        <input type = "checkbox" id = "tkbRadio">
        <label for = "tkbRadio" class = "toolKitButton" > > </label>

        <!-- #Theme Button -->
        <div id = "themeButton">
            <div class = "circle1"></div> <div class = "circle2"></div>
        </div>

        <!-- #Size Adjust -->
         <span class = "sizeAdjust">
            <h3> Size: </h3>
            <button type = "button" class = "sizeButtons" id = "sizeDown"> - </button>
            <button type = "button" class = "sizeButtons" id = "sizeUp"> + </button>
         </span>
    </div>

    <script type="importmap">
    {
        "imports": { "html2canvas": "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/+esm" }
    }
    </script>
    <script type = "module" src = "function.js"></script> <!-- if separate css file is used -->
</body>
